bio:
  pt: "Sou professor associado da Universidade Federal de Goiás (UFG), onde lidero o HI-Lab (Hybrid Intelligence Laboratory) e atuo como professor permanente do Programa de Pós-Graduação em Administração. Sou editor-chefe da Brazilian Administration Review (BAR), da ANPAD, e editor associado de periódicos nacionais e internacionais. Doutor em Administração pela FGV-EAESP, com doutorado sanduíche na Cornell University, fiz pós-doutorados em machine learning aplicado ao marketing (UFRGS) e em economia comportamental aplicada ao marketing (UnB). Pesquiso a adoção de novas tecnologias em marketing, a tomada de decisão do consumidor e as implicações cognitivas e éticas da inteligência artificial. Também formo pesquisadores e editores para o uso responsável de IA na ciência."
  en: "I am an Associate Professor at the Federal University of Goiás (UFG), where I lead the HI-Lab (Hybrid Intelligence Laboratory) and serve as permanent faculty in the Graduate Program in Business Administration. I am Editor-in-Chief of the Brazilian Administration Review (BAR), published by ANPAD, and an associate editor of Brazilian and international journals. I hold a PhD in Business Administration from FGV-EAESP, including a visiting doctoral period at Cornell University, and completed postdoctoral work in machine learning applied to marketing (UFRGS) and behavioral economics applied to marketing (UnB). My research covers the adoption of new technologies in marketing, consumer decision-making, and the cognitive and ethical implications of artificial intelligence. I also train researchers and editors in the responsible use of AI in science."
