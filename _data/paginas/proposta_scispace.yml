blocks:
  - type: md
    lead: true
    pt: |
      Você tem uma ideia de pesquisa, mas transformá-la em uma proposta sólida parece uma montanha? É preciso definir o problema, encontrar a lacuna na literatura, justificar a relevância, escolher o método e manter tudo coerente para a banca ou para o edital.

      Esta página reúne os materiais do workshop "Da ideia ao projeto aprovado: escreva sua proposta de pesquisa passo a passo com o Agente SciSpace". São seis etapas, com prompts prontos para copiar. Em cada uma, o agente apoia a elaboração e a decisão é sua.
    en: |
      You have a research idea, but turning it into a solid proposal feels like climbing a mountain? You need to define the problem, find the gap in the literature, justify its relevance, choose the method and keep everything coherent for the committee or the funding call.

      This page gathers the materials from the workshop "Da ideia ao projeto aprovado: escreva sua proposta de pesquisa passo a passo com o Agente SciSpace" (From idea to approved project: write your research proposal step by step with the SciSpace Agent), held in Portuguese. There are six steps, with prompts ready to copy. In each one, the agent supports the work and the decision is yours.
