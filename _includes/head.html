<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- capture title %}{{ p.name }} | {{ p.tagline[lang] }}{% endcapture %}
<title>{{ title | escape }}</title>
<meta name="description" content="{{ p.description[lang] | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="pt-BR" href="{{ '/' | absolute_url }}">
<link rel="alternate" hreflang="en" href="{{ '/en/' | absolute_url }}">
<link rel="alternate" hreflang="x-default" href="{{ '/' | absolute_url }}">
<meta property="og:type" content="profile">
<meta property="og:title" content="{{ title | escape }}">
<meta property="og:description" content="{{ p.description[lang] | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:locale" content="{{ t.og_locale[lang] }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ title | escape }}">
<meta name="twitter:description" content="{{ p.description[lang] | escape }}">
{%- if photo %}
<meta property="og:image" content="{{ p.photo_share | absolute_url }}">
<meta name="twitter:image" content="{{ p.photo_share | absolute_url }}">
{%- endif %}
<meta name="theme-color" content="#0A0F1E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F5C400'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial' font-weight='700' font-size='15' fill='%2314213D'%3ERL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..600;1,8..60,300..500&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<script>
document.documentElement.classList.add("js");
try { if (localStorage.getItem("contrast") === "high") document.documentElement.classList.add("hc"); } catch (e) {}
</script>
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Person","name":{{ p.name | jsonify }},"alternateName":{{ p.full_name | jsonify }},"jobTitle":{{ p.role[lang] | jsonify }},"url":{{ '/' | absolute_url | jsonify }}{% if photo %},"image":{{ photo | absolute_url | jsonify }}{% endif %},"sameAs":[{% for l in links %}{{ l.url | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %}]}
</script>
</head>
